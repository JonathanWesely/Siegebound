; ProjectName feeds the packaged exe's Windows file properties. Measured chain
; (UE 5.8 source, read - not assumed): this key -> WindowsTargetRules.ProductName
; via [ConfigFile(ConfigHierarchyType.Game, ...)] (UEBuildWindows.cs:539-540)
; -> the PROJECT_PRODUCT_NAME define (VCToolChain.cs:2989-2991) -> the
; BUILD_PROJECT_PRODUCT_NAME resource string (Build/Windows/Resources/
; Default.rc2:26-30) -> the "ProductName" AND "FileDescription" fields of the
; version resource (Default.rc2:76,78). That is why the shipped exe read
; "Third Person Game Template". Verified by measurement at TASK-699, not here.
ProjectName=Siegebound
; The standalone game's window title. Read at game-window creation via
; GConfig->GetText(..., "ProjectDisplayedTitle", ..., GGameIni)
; (Runtime/Engine/Private/GameEngine.cpp:488); when empty the engine falls back
; to the "{GameName}" token, which expands to FApp::GetProjectName() =
; "GitClaudeUnrealTest". A literal is used here deliberately: the token would
; re-introduce the very string this task exists to remove.
ProjectDisplayedTitle=NSLOCTEXT("[/Script/EngineSettings]", "ProjectDisplayedTitle", "Siegebound")
